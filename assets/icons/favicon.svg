<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0047BA"/>
      <stop offset="100%" stop-color="#002878"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70E0FF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Badge / Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#favGrad)"/>
  
  <!-- Subtle Frost Accent Outline -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Snowflake / Cold Energy Symbol behind monogram -->
  <g transform="translate(32,24) scale(0.65)" stroke="url(#iceGrad)" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <line x1="0" y1="-18" x2="0" y2="18"/>
    <line x1="-15.5" y1="-9" x2="15.5" y2="9"/>
    <line x1="-15.5" y1="9" x2="15.5" y2="-9"/>
    <!-- Branch v-ticks -->
    <path d="M-4,-13 L0,-17 L4,-13" fill="none"/>
    <path d="M-4,13 L0,17 L4,13" fill="none"/>
    <path d="M-13,-3 L-16,-8 L-11,-9" fill="none"/>
    <path d="M13,3 L16,8 L11,9" fill="none"/>
    <path d="M-13,3 L-16,8 L-11,9" fill="none"/>
    <path d="M13,-3 L16,-8 L11,-9" fill="none"/>
    <circle cx="0" cy="0" r="3.5" fill="#70E0FF"/>
  </g>

  <!-- Monogram LR in bold modern lettering -->
  <text x="32" y="53" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="23" fill="#FFFFFF" text-anchor="middle" letter-spacing="1" filter="url(#glow)">LR</text>
</svg>
